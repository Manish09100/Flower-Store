{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Flower Website</title>
    <link rel="stylesheet" href="{% static 'main/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        .form-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
            background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        .form-container h2 {
            text-align: center;
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 20px;
        }
        .form-container form .box {
            width: 100%;
            margin: 10px 0;
            padding: 12px 14px;
            font-size: 1.6rem;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-container .btn {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 10px;
        }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 1.5rem;
            color: #666;
        }
    </style>
</head>
<body>

    <section>
        <div class="form-container">
            <h2>Add New Product</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                {{ form.as_p }}

                <button type="submit" class="btn">Add Product</button>
            </form>
            <a href="{% url 'index' %}" class="back-btn">Back to Home</a>
        </div>
    </section>

</body>
</html>
